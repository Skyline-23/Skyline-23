name: Update Tokscale cards

on:
  schedule:
    - cron: "17 21 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_tokscale.py
      - .github/workflows/update-tokscale.yml

permissions:
  contents: read

concurrency:
  group: update-tokscale
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download and validate both themes
        run: python3 scripts/update_tokscale.py
      - name: Commit refreshed cards
        run: |
          git add assets/tokscale-light.svg assets/tokscale-dark.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(profile): Refresh Tokscale cards" \
            -m "- Update the GitHub-hosted light and dark activity snapshots."
          git push
